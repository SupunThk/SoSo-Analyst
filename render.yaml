services:
  - type: web
    name: soso-analyst-backend
    env: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SOSO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: SODEX_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SOSO_REQUEST_TIMEOUT_MS
        value: 15000
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: 60000
      - key: ETHERSCAN_REQUEST_TIMEOUT_MS
        value: 15000
      - key: OPENOCEAN_REQUEST_TIMEOUT_MS
        value: 15000
      - key: SODEX_REQUEST_TIMEOUT_MS
        value: 15000
      - key: SODEX_NETWORK
        value: mainnet
      - key: SODEX_REST_BASE_URL
        value: https://mainnet-gw.sodex.dev/api/v1
      - key: ETHERSCAN_CHAIN_IDS
        value: 1,8453,56,137,42161,10,43114
      - key: ETHERSCAN_TOKEN_TRANSFER_OFFSET
        value: 100
      - key: ETHERSCAN_TOKENS_PER_CHAIN
        value: 12
      - key: AGENT_RATE_LIMIT_PER_MINUTE
        value: 20
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: 60
